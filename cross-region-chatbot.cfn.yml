---
AWSTemplateFormatVersion: 2010-09-09
Description: Chatbot for cross-region notification to Slack
Parameters:
  SnsTopicName:
    Description: Set the SNS topic name.
    Type: String
    Default: guardduty-finding-topic
  SlackWorkspaceId:
    Description: Slack workspace ID authorized in Amazon Q Developer in chat applications.
    Type: String
    AllowedPattern: '^[0-9A-Z]+$'
  SlackChannelId:
    Description: Slack channel ID (not the channel name).
    Type: String
    AllowedPattern: '^[A-Za-z0-9]+$'
Resources:
  ChatbotReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: chatbot.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonGuardDutyReadOnlyAccess
  ChatbotConfiguration:
    Type: AWS::Chatbot::SlackChannelConfiguration
    Properties:
      ConfigurationName: !Sub ${SnsTopicName}-chatbot-config
      IamRoleArn: !GetAtt ChatbotReadOnlyRole.Arn
      GuardrailPolicies:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonGuardDutyReadOnlyAccess
      LoggingLevel: ERROR
      SlackChannelId: !Ref SlackChannelId
      SlackWorkspaceId: !Ref SlackWorkspaceId
      SnsTopicArns:
        - !Sub arn:${AWS::Partition}:sns:us-east-1:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:us-east-2:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:us-west-1:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:us-west-2:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:ap-south-1:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:ap-northeast-3:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:ap-northeast-2:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:ap-southeast-1:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:ap-southeast-2:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:ap-northeast-1:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:ca-central-1:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:eu-central-1:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:eu-west-1:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:eu-west-2:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:eu-west-3:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:eu-north-1:${AWS::AccountId}:${SnsTopicName}
        - !Sub arn:${AWS::Partition}:sns:sa-east-1:${AWS::AccountId}:${SnsTopicName}
        # - !Sub arn:${AWS::Partition}:sns:af-south-1:${AWS::AccountId}:${SnsTopicName}
        # - !Sub arn:${AWS::Partition}:sns:ap-east-1:${AWS::AccountId}:${SnsTopicName}
        # - !Sub arn:${AWS::Partition}:sns:ap-south-2:${AWS::AccountId}:${SnsTopicName}
        # - !Sub arn:${AWS::Partition}:sns:ap-southeast-3:${AWS::AccountId}:${SnsTopicName}
        # - !Sub arn:${AWS::Partition}:sns:ap-southeast-4:${AWS::AccountId}:${SnsTopicName}
        # - !Sub arn:${AWS::Partition}:sns:eu-south-1:${AWS::AccountId}:${SnsTopicName}
        # - !Sub arn:${AWS::Partition}:sns:eu-south-2:${AWS::AccountId}:${SnsTopicName}
        # - !Sub arn:${AWS::Partition}:sns:eu-central-2:${AWS::AccountId}:${SnsTopicName}
        # - !Sub arn:${AWS::Partition}:sns:me-south-1:${AWS::AccountId}:${SnsTopicName}
        # - !Sub arn:${AWS::Partition}:sns:me-central-1:${AWS::AccountId}:${SnsTopicName}
Outputs:
  ChatbotConfiguration:
    Value: !Ref ChatbotConfiguration
    Export:
      Name: !Sub ${AWS::StackName}-ChatbotConfiguration
