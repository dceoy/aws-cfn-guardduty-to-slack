---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  lint:
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/aws-cloudformation-lint.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    with:
      use-checkov: false
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - lint
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    with:
      unconditional: true
